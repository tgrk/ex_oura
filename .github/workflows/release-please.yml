on:
  push:
    branches:
      - master

permissions:
  contents: read

name: release-please

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: elixir

  publish:
    name: Stage Hex package and docs
    needs: release-please
    # Releases created with GITHUB_TOKEN do not trigger another release/tag workflow.
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: hex-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Install current Hex (Workload Identity requires Hex 2.6+ and OTP 27+)
        run: mix local.hex --force

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted

      - name: Run cassette-backed tests
        run: mix test
        env:
          MIX_ENV: test
          OURA_ACCESS_TOKEN: cassette-test-token

      - name: Publish package and docs with Workload Identity
        run: mix hex.publish --yes
